<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beli × Uber Eats Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0f11;
      --surface:  #18191d;
      --surface2: #222429;
      --border:   #2e3035;
      --text:     #e8e9ec;
      --muted:    #8b8e99;
      --uber:     #06c167;
      --beli:     #ff6b35;
      --green:    #22c55e;
      --yellow:   #eab308;
      --red:      #ef4444;
    }

    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── Header ── */
    header {
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:1rem; padding:1.2rem 2rem;
      background:var(--surface); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:100;
      backdrop-filter:blur(8px);
    }

    .logo {
      display:flex; align-items:center; gap:.6rem;
      font-size:1.15rem; font-weight:700; letter-spacing:-.02em;
    }
    .logo-beli { color:var(--beli); }
    .logo-sep  { color:var(--muted); font-weight:300; }
    .logo-uber { color:var(--uber); }
    .logo-sub  { color:var(--muted); font-weight:400; font-size:.88rem; margin-left:.2rem; }

    .controls { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }

    input[type=text] {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text); border-radius:8px; padding:.45rem .9rem;
      font-size:.84rem; font-family:inherit; width:230px; outline:none;
      transition:border-color .2s;
    }
    input[type=text]:focus { border-color:var(--beli); }

    select {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text); border-radius:8px; padding:.45rem .8rem;
      font-size:.84rem; font-family:inherit; cursor:pointer; outline:none;
    }

    .btn {
      padding:.45rem 1rem; border:none; border-radius:8px;
      font-family:inherit; font-size:.84rem; font-weight:600;
      cursor:pointer; transition:opacity .15s;
    }
    .btn:hover { opacity:.82; }
    .btn-primary { background:var(--beli); color:#fff; }

    /* ── Stats bar ── */
    .stats {
      display:flex; gap:2rem; flex-wrap:wrap;
      padding:.9rem 2rem; background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .stat { display:flex; flex-direction:column; gap:.1rem; }
    .stat-val { font-size:1.35rem; font-weight:700; }
    .stat-lbl { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }

    /* ── Banner ── */
    .banner {
      margin:1rem 2rem 0; padding:.6rem 1rem; border-radius:8px;
      font-size:.82rem; display:none; align-items:center; gap:.5rem;
      line-height:1.45;
    }
    .banner-info    { background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.28); color:#93c5fd; display:flex; }
    .banner-warning { background:rgba(234,179,8,.1);   border:1px solid rgba(234,179,8,.28);  color:#fde047; display:flex; }
    .banner-demo    { background:rgba(255,107,53,.1);  border:1px solid rgba(255,107,53,.3);  color:#fdba74; display:flex; }

    /* ── Grid ── */
    #grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
      gap:1rem; padding:1.25rem 2rem 4rem;
    }

    /* ── Cards ── */
    .card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; overflow:hidden; display:flex; flex-direction:column;
      transition:transform .15s, border-color .2s;
    }
    .card:hover { transform:translateY(-3px); border-color:#444; }

    .card-img {
      width:100%; height:144px; object-fit:cover;
      background:var(--surface2); display:block;
    }
    .card-img-ph {
      width:100%; height:144px; background:var(--surface2);
      display:flex; align-items:center; justify-content:center;
      font-size:2.8rem;
    }

    .card-body { padding:.95rem; display:flex; flex-direction:column; gap:.55rem; flex:1; }

    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; }

    .card-name { font-size:.95rem; font-weight:600; line-height:1.3; flex:1; }
    .card-cats { font-size:.74rem; color:var(--muted); margin-top:.15rem; }

    /* ── Beli score badge ── */
    .beli-badge {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-width:54px; height:54px; border-radius:11px;
      font-weight:700; font-size:1.15rem; flex-shrink:0;
    }
    .beli-lbl { font-size:.55rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.8; }

    .score-high   { background:rgba(34,197,94,.18);  color:#4ade80;  border:1px solid rgba(34,197,94,.35); }
    .score-mid    { background:rgba(234,179,8,.14);  color:#fbbf24;  border:1px solid rgba(234,179,8,.35); }
    .score-low    { background:rgba(239,68,68,.14);  color:#f87171;  border:1px solid rgba(239,68,68,.28); }
    .score-none   { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
    .score-loading{ background:var(--surface2); color:var(--muted); border:1px solid var(--border); animation:pulse 1.4s ease-in-out infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .card-meta { display:flex; gap:.65rem; flex-wrap:wrap; font-size:.77rem; color:var(--muted); align-items:center; }
    .uber-star  { color:var(--uber); font-weight:600; }

    .card-foot {
      padding:.7rem .95rem; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
    }
    .pill { background:var(--surface2); border-radius:6px; padding:.18rem .5rem; font-size:.72rem; color:var(--muted); }
    .pills { display:flex; gap:.35rem; flex-wrap:wrap; }

    .order-link {
      font-size:.75rem; font-weight:600; color:var(--uber);
      text-decoration:none; transition:opacity .15s;
    }
    .order-link:hover { opacity:.7; }

    /* ── Skeletons ── */
    .skeleton {
      border-radius:14px; height:260px;
      background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
      background-size:200% 100%; animation:shimmer 1.5s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .empty {
      grid-column:1/-1; display:flex; flex-direction:column;
      align-items:center; gap:1rem; padding:5rem 2rem;
      color:var(--muted); text-align:center;
    }
    .empty-icon { font-size:3rem; }

    /* ── Beli progress toast ── */
    #beli-toast {
      position:fixed; bottom:1.5rem; right:1.5rem;
      background:var(--surface); border:1px solid var(--border);
      border-radius:13px; padding:.9rem 1.1rem; font-size:.8rem;
      display:none; flex-direction:column; gap:.4rem; min-width:230px;
      box-shadow:0 8px 32px rgba(0,0,0,.55); z-index:200;
    }
    .toast-title { font-weight:600; color:var(--beli); display:flex; align-items:center; gap:.4rem; }
    .prog-track  { background:var(--surface2); border-radius:4px; height:5px; overflow:hidden; }
    .prog-fill   { height:100%; background:var(--beli); border-radius:4px; transition:width .25s; }
    .prog-txt    { color:var(--muted); }

    .spinner {
      display:inline-block; width:13px; height:13px;
      border:2px solid rgba(255,107,53,.3); border-top-color:var(--beli);
      border-radius:50%; animation:spin .7s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-beli">Beli</span>
    <span class="logo-sep">×</span>
    <span class="logo-uber">Uber&nbsp;Eats</span>
    <span class="logo-sub">Dashboard</span>
  </div>
  <div class="controls">
    <input id="loc" type="text" value="Islip, NY 11751" placeholder="Address or city…" />
    <select id="sort">
      <option value="beli_desc">Beli Score ↓</option>
      <option value="beli_asc">Beli Score ↑</option>
      <option value="uber_desc">Uber Rating ↓</option>
      <option value="uber_asc">Uber Rating ↑</option>
      <option value="name_asc">Name A–Z</option>
    </select>
    <button class="btn btn-primary" id="search-btn">Search</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><span class="stat-val" id="s-total">—</span><span class="stat-lbl">Restaurants</span></div>
  <div class="stat"><span class="stat-val" id="s-beli" style="color:var(--beli)">—</span><span class="stat-lbl">On Beli</span></div>
  <div class="stat"><span class="stat-val" id="s-abeli" style="color:var(--beli)">—</span><span class="stat-lbl">Avg Beli Score</span></div>
  <div class="stat"><span class="stat-val" id="s-auber" style="color:var(--uber)">—</span><span class="stat-lbl">Avg Uber Rating</span></div>
</div>

<div id="banner" class="banner"></div>
<div id="grid"></div>

<div id="beli-toast">
  <div class="toast-title"><span class="spinner"></span>Fetching Beli scores…</div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-txt" id="prog-txt">0 / 0</div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let restaurants = [];
  let busy = false;

  // ── Helpers ────────────────────────────────────────────────────────────────
  const grid   = document.getElementById('grid');
  const banner = document.getElementById('banner');
  const toast  = document.getElementById('beli-toast');
  const pfill  = document.getElementById('prog-fill');
  const ptxt   = document.getElementById('prog-txt');

  function showBanner(msg, type) {
    banner.className = `banner banner-${type}`;
    banner.textContent = msg;
  }

  function skeletons(n = 8) {
    grid.innerHTML = Array(n).fill('<div class="skeleton"></div>').join('');
  }

  function scoreClass(s) {
    if (s === null) return 'score-none';
    return s >= 7 ? 'score-high' : s >= 5 ? 'score-mid' : 'score-low';
  }

  function emoji(cats) {
    const t = (cats[0] || '').toLowerCase();
    const m = {pizza:'🍕',burger:'🍔',sushi:'🍣',chinese:'🥡',japanese:'🍱',
               mexican:'🌮',italian:'🍝',indian:'🍛',thai:'🍜',salad:'🥗',
               sandwich:'🥪',chicken:'🍗',seafood:'🦞',breakfast:'🥞',
               coffee:'☕',american:'🍔',greek:'🥙',asian:'🍜',shakes:'🥤',bakery:'🥐'};
    for (const [k,v] of Object.entries(m)) if (t.includes(k)) return v;
    return '🍽️';
  }

  function cardId(r) {
    return 'c-' + (r.id || r.name.replace(/\W+/g,'-'));
  }

  // ── Render card ────────────────────────────────────────────────────────────
  function renderCard(r) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = cardId(r);

    const loading = r._beli_status === 'loading';
    const sc  = loading ? 'score-loading' : scoreClass(r.beli_score);
    const sv  = loading ? '…' : (r.beli_score !== null ? r.beli_score.toFixed(1) : '—');
    const cats = (r.categories || []).slice(0,2).join(' · ') || 'Restaurant';

    const imgHtml = r.image
      ? `<img class="card-img" src="${r.image}" alt="${r.name}" loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const phHtml = `<div class="card-img-ph" ${r.image ? 'style="display:none"' : ''}>${emoji(r.categories || [])}</div>`;

    const uberStr = r.uber_rating
      ? `<span class="uber-star">⭐ ${r.uber_rating.toFixed(1)}</span>${r.rating_count ? `<span>${r.rating_count.toLocaleString()} reviews</span>` : ''}`
      : `<span>No Uber rating</span>`;

    const pills = [
      r.delivery_time ? `<span class="pill">⏱ ${r.delivery_time}</span>` : '',
      r.delivery_fee  ? `<span class="pill">${r.delivery_fee}</span>`     : '',
      r.price_range   ? `<span class="pill">${r.price_range}</span>`      : '',
    ].join('');

    card.innerHTML = `
      ${imgHtml}${phHtml}
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${r.name}</div>
            <div class="card-cats">${cats}</div>
          </div>
          <div class="beli-badge ${sc}" id="badge-${cardId(r)}">
            <div>${sv}</div>
            <div class="beli-lbl">Beli</div>
          </div>
        </div>
        <div class="card-meta">${uberStr}</div>
      </div>
      <div class="card-foot">
        <div class="pills">${pills}</div>
        <a class="order-link" href="${r.url}" target="_blank" rel="noopener">Order ↗</a>
      </div>`;

    return card;
  }

  // ── Patch score badge in-place ─────────────────────────────────────────────
  function patchBadge(r) {
    const el = document.getElementById(`badge-${cardId(r)}`);
    if (!el) return;
    el.className = `beli-badge ${scoreClass(r.beli_score)}`;
    el.innerHTML = `<div>${r.beli_score !== null ? r.beli_score.toFixed(1) : '—'}</div><div class="beli-lbl">Beli</div>`;
  }

  // ── Stats ──────────────────────────────────────────────────────────────────
  function updateStats() {
    const found = restaurants.filter(r => r.beli_score !== null);
    const avgB  = found.length ? (found.reduce((s,r)=>s+r.beli_score,0)/found.length).toFixed(1) : '—';
    const withU = restaurants.filter(r => r.uber_rating > 0);
    const avgU  = withU.length ? (withU.reduce((s,r)=>s+r.uber_rating,0)/withU.length).toFixed(1) : '—';
    document.getElementById('s-total').textContent = restaurants.length;
    document.getElementById('s-beli').textContent  = found.length;
    document.getElementById('s-abeli').textContent = avgB;
    document.getElementById('s-auber').textContent = avgU;
  }

  // ── Sort + render ──────────────────────────────────────────────────────────
  function renderSorted() {
    const sort = document.getElementById('sort').value;
    const list = [...restaurants];
    switch (sort) {
      case 'beli_desc': list.sort((a,b) => (b.beli_score??-1) - (a.beli_score??-1)); break;
      case 'beli_asc':  list.sort((a,b) => (a.beli_score??11) - (b.beli_score??11)); break;
      case 'uber_desc': list.sort((a,b) => b.uber_rating - a.uber_rating); break;
      case 'uber_asc':  list.sort((a,b) => a.uber_rating - b.uber_rating); break;
      case 'name_asc':  list.sort((a,b) => a.name.localeCompare(b.name)); break;
    }
    grid.innerHTML = '';
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">🍽️</div><div>No restaurants found.</div></div>';
      return;
    }
    list.forEach(r => grid.appendChild(renderCard(r)));
  }

  // ── Beli score pipeline ────────────────────────────────────────────────────
  async function fetchBeliScores() {
    toast.style.display = 'flex';
    const total = restaurants.length;
    let done = 0;

    for (const r of restaurants) {
      r._beli_status = 'loading';
      ptxt.textContent = `${done} / ${total}`;
      pfill.style.width = `${Math.round(done/total*100)}%`;

      try {
        const res  = await fetch(`/api/beli?name=${encodeURIComponent(r.name)}`);
        const data = await res.json();
        r.beli_score  = data.beli_score;
        r._beli_status = 'done';
      } catch {
        r.beli_score  = null;
        r._beli_status = 'error';
      }

      patchBadge(r);
      done++;
      ptxt.textContent = `${done} / ${total}`;
      pfill.style.width = `${Math.round(done/total*100)}%`;
      updateStats();

      // 300 ms gap — be respectful to Beli's servers
      await new Promise(ok => setTimeout(ok, 300));
    }

    toast.style.display = 'none';
    busy = false;

    // Re-sort if ordered by Beli
    if (document.getElementById('sort').value.startsWith('beli')) renderSorted();
  }

  // ── Load pipeline ──────────────────────────────────────────────────────────
  async function load() {
    if (busy) return;
    busy = true;

    const address = document.getElementById('loc').value.trim();
    if (!address) { busy = false; return; }

    banner.className = 'banner';
    banner.textContent = '';
    skeletons();
    restaurants = [];
    updateStats();

    try {
      const res  = await fetch(`/api/restaurants?address=${encodeURIComponent(address)}`);
      const data = await res.json();

      if (!data.restaurants || data.restaurants.length === 0) {
        showBanner('No restaurants found for that location.', 'warning');
        grid.innerHTML = '<div class="empty"><div class="empty-icon">🍽️</div><div>No results.</div></div>';
        busy = false;
        return;
      }

      restaurants = data.restaurants.map(r => ({...r, beli_score:null, _beli_status:'pending'}));

      if (data.is_demo) {
        showBanner(
          '⚠️  Demo mode — Uber Eats blocked the API request (bot protection). ' +
          'Showing sample restaurants for Islip, NY. Beli scores are being fetched live.',
          'demo'
        );
      } else {
        showBanner(`Loaded ${data.count} restaurants from Uber Eats. Fetching Beli scores…`, 'info');
      }

      renderSorted();
      updateStats();
      fetchBeliScores();  // busy released inside fetchBeliScores

    } catch (err) {
      showBanner(`Network error: ${err.message}`, 'warning');
      grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div>${err.message}</div></div>`;
      busy = false;
    }
  }

  // ── Wire up ────────────────────────────────────────────────────────────────
  document.getElementById('search-btn').addEventListener('click', load);
  document.getElementById('sort').addEventListener('change', renderSorted);
  document.getElementById('loc').addEventListener('keydown', e => { if (e.key==='Enter') load(); });

  load();
</script>
</body>
</html>
